<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B2D5B">
<meta name="description" content="Packing, bills and setup checklist for a J-1 postdoc move from Pune to NC State University, Raleigh.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Raleigh Packing List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: app bar on top, one scrolling view, bottom tab bar (Overview / Checklist / Bills). Luggage-tag header on Overview. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#F7F8FB; --ink:#16213A; --muted:#5A6580; --line:#DFE3EC;
  --navy:#1B2D5B; --navy-2:#2A417A; --saffron:#E58A12; --on-saffron:#1B1200;
  --ok:#1E8A50; --ok-bg:#E2F4EA; --mid:#2F6FDB; --mid-bg:#E5EEFC; --warn:#C27500; --warn-bg:#FFF1DB; --low:#C9372C; --low-bg:#FDE7E5;
  --chip:#EEF1F7; --shadow:0 1px 2px rgba(22,33,58,.06),0 4px 14px rgba(22,33,58,.06);
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1422; --surface:#18213A; --surface-2:#1D2744; --ink:#E7ECF7; --muted:#9BA6C2; --line:#2B375A;
  --navy:#22386F; --navy-2:#2E4887; --saffron:#F2A23C; --on-saffron:#1B1200;
  --ok:#5FD08F; --ok-bg:#153424; --mid:#7FA8F5; --mid-bg:#1B2A4D; --warn:#F2B04C; --warn-bg:#3A2A12; --low:#FF8A80; --low-bg:#3D1C1A;
  --chip:#222C48; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1422; --surface:#18213A; --surface-2:#1D2744; --ink:#E7ECF7; --muted:#9BA6C2; --line:#2B375A;
  --navy:#22386F; --navy-2:#2E4887; --saffron:#F2A23C; --on-saffron:#1B1200;
  --ok:#5FD08F; --ok-bg:#153424; --mid:#7FA8F5; --mid-bg:#1B2A4D; --warn:#F2B04C; --warn-bg:#3A2A12; --low:#FF8A80; --low-bg:#3D1C1A;
  --chip:#222C48; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4}
[hidden]{display:none!important}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none}

/* app bar */
.appbar{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid transparent}
.appbar.scrolled{border-bottom-color:var(--line)}
.appbar h1{font-family:var(--display);font-weight:800;font-size:20px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.savebtn{border:0;border-radius:999px;padding:9px 16px;font-weight:700;background:var(--saffron);color:var(--on-saffron);min-height:40px}
.savebtn:disabled{background:var(--chip);color:var(--muted)}
#status{font-size:12px;color:var(--muted);text-align:right;max-width:40%}
#status.dirty{color:var(--warn);font-weight:700}#status.ok{color:var(--ok);font-weight:700}#status.err{color:var(--low);font-weight:700}

.view{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:6px 120px;display:flex;flex-direction:column;gap:14px}

/* luggage tag */
.tag{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;border-radius:18px;padding:18px;position:relative;overflow:hidden}
.tag::after{content:"";position:absolute;right:18px;top:18px;width:14px;height:14px;border-radius:50%;background:var(--bg);box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.route{font-family:var(--display);font-weight:800;font-size:clamp(28px,8vw,38px);line-height:1;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.route small{font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.tag .sub{margin:6px 0 14px;font-size:14px;opacity:.85}
.ring-row{display:flex;gap:16px;align-items:center}
.ring{width:84px;height:84px;flex:none}
.ring circle{fill:none;stroke-width:9}
.ring .bgc{stroke:rgba(255,255,255,.18)}
.ring .fg{stroke:var(--saffron);stroke-linecap:round;transition:stroke-dashoffset .4s}
.ring text{fill:#fff;font-family:var(--display);font-weight:800;font-size:22px}
.ring-meta{display:flex;flex-direction:column;gap:6px;min-width:0;font-variant-numeric:tabular-nums}
.ring-meta b{font-size:18px}
.bagpills{display:flex;gap:6px;flex-wrap:wrap}
.bagpills span{font-size:12px;background:rgba(255,255,255,.12);border:1px dashed rgba(255,255,255,.4);padding:3px 8px;border-radius:6px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px;gap:10px}
.card-h h2{font-family:var(--display);font-weight:600;font-size:17px;margin:0}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:0 16px 10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* progress rows */
.prow{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.prow .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--chip);color:var(--navy)}
:root[data-theme="dark"] .prow .ic{color:var(--mid)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .prow .ic{color:var(--mid)}}
.prow .nm{font-weight:700;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:8px;border-radius:6px;background:var(--chip);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;border-radius:6px;width:0;transition:width .35s}
.left{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.lv-done{background:var(--ok-bg);color:var(--ok)} .lv-hi{background:var(--mid-bg);color:var(--mid)} .lv-mid{background:var(--warn-bg);color:var(--warn)} .lv-low{background:var(--low-bg);color:var(--low)}
.fill-done{background:var(--ok)} .fill-hi{background:var(--mid)} .fill-mid{background:var(--warn)} .fill-low{background:var(--low)}

/* checklist */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-height:42px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;min-height:42px;font-weight:700;display:inline-flex;gap:6px;align-items:center}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.danger{color:var(--low)}
.grow{flex:1;min-width:140px}
.sec{overflow:hidden}
.sec-h{display:grid;grid-template-columns:34px 1fr auto 18px;gap:10px;align-items:center;padding:14px 14px 12px 16px;width:100%;background:none;border:0;text-align:left}
.sec-h .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--chip);color:var(--navy)}
.sec-h h2{font-family:var(--display);font-weight:600;font-size:17px;margin:0}
.chev{width:18px;height:18px;transition:transform .2s;color:var(--muted)}
.open>.sec-h .chev{transform:rotate(180deg)}
.note{margin:0 16px 10px;padding:9px 11px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:14px}
.body{border-top:1px solid var(--line)}
.item{border-bottom:1px solid var(--line)}
.row{display:flex;align-items:flex-start;gap:12px;padding:12px 10px 10px 16px}
.main{flex:1;min-width:0}
.txt{overflow-wrap:anywhere;padding-top:2px}
.done>.row .txt,.sub.done .txt{color:var(--muted);text-decoration:line-through}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;align-items:center}
.cb{appearance:none;-webkit-appearance:none;width:26px;height:26px;border:2px solid var(--muted);border-radius:8px;flex:none;display:grid;place-items:center;background:var(--surface);margin:0;transition:background .15s,border-color .15s}
.cb:checked{background:var(--ok);border-color:var(--ok)}
.cb:checked::after{content:"";width:7px;height:13px;border:solid #fff;border-width:0 3px 3px 0;transform:translateY(-2px) rotate(45deg)}
.cb.part{border-color:var(--saffron)}
.cb.part::after{content:"";width:12px;height:3px;background:var(--saffron);border-radius:2px}
.pill{font-size:12px;font-weight:700;border:0;border-radius:999px;padding:5px 10px;background:var(--chip);color:var(--muted);display:inline-flex;gap:4px;align-items:center;min-height:30px;font-variant-numeric:tabular-nums}
.pill svg{width:14px;height:14px}
.pill.has{background:var(--mid-bg);color:var(--mid)}
select.pill{appearance:none;-webkit-appearance:none;padding-right:10px;max-width:120px}
.mini{border:0;background:none;padding:6px;border-radius:10px;color:var(--muted);display:grid;place-items:center;min-width:38px;min-height:38px}
.rm-confirm{background:var(--low);color:#fff;border:0;border-radius:10px;font-size:12px;font-weight:700;padding:8px 10px}
.subs{background:var(--surface-2);padding:4px 0 8px}
.sub{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 54px;min-height:44px}
.sub .txt{flex:1;min-width:0;padding:0}
.sub .cb{width:22px;height:22px;border-radius:6px}
.sub .cb:checked::after{width:6px;height:11px}
.add{display:flex;gap:8px;padding:10px 12px 12px 16px;flex-wrap:wrap}
.subs .add{padding-left:54px}
.add input{flex:1;min-width:140px;border:1px dashed var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;min-height:42px}
.add button{border:0;background:var(--navy);color:#fff;border-radius:10px;padding:8px 14px;font-weight:700;min-height:42px}
.empty{padding:14px 16px;color:var(--muted);font-size:14px}

/* bills */
.billsum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{padding:12px 14px}
.stat b{display:block;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.bill{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:12px;border:0;background:none;width:100%;text-align:left;border-top:1px solid var(--line)}
.bill:first-child{border-top:0}
.thumb{width:64px;height:80px;border-radius:10px;background:var(--chip);overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:11px;font-weight:700}
.thumb img{width:100%;height:100%;object-fit:cover}
.bill h3{margin:0;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bill .amt{font-variant-numeric:tabular-nums;font-weight:700}
.bill .meta{margin-top:6px}
.due{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.due.late{background:var(--low-bg);color:var(--low)} .due.soon{background:var(--warn-bg);color:var(--warn)} .due.ok{background:var(--ok-bg);color:var(--ok)} .due.none{background:var(--chip);color:var(--muted)}
.fab{position:fixed;right:max(16px,calc(50% - 364px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:15;border:0;border-radius:18px;background:var(--saffron);color:var(--on-saffron);font-weight:800;padding:14px 18px;display:flex;gap:8px;align-items:center;box-shadow:0 6px 18px rgba(0,0,0,.2)}

/* bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,1fr)}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted);padding:6px 0;border-radius:12px;min-height:52px}
.tabs button[aria-current="page"]{color:var(--navy);background:var(--chip)}
:root[data-theme="dark"] .tabs button[aria-current="page"]{color:var(--saffron)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tabs button[aria-current="page"]{color:var(--saffron)}}
.tabs .badge{font-size:10px;background:var(--low);color:#fff;border-radius:999px;padding:0 6px;margin-left:2px}

/* sheet */
dialog.sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:640px;max-height:92vh;border-radius:20px 20px 0 0;background:var(--surface);color:var(--ink)}
@media (min-width:700px){dialog.sheet{margin:auto;border-radius:20px}}
dialog.sheet::backdrop{background:rgba(10,15,30,.5)}
.sheet-h{position:sticky;top:0;background:var(--surface);display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);z-index:1}
.sheet-h h2{flex:1;margin:0;font-family:var(--display);font-size:18px}
.sheet-b{padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label,.fld .lb{font-size:13px;font-weight:700;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 12px;min-height:44px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scanbox{border:2px dashed var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;align-items:stretch}
.scanbtns{display:flex;gap:8px;flex-wrap:wrap}
.scanbtns label{flex:1;min-width:130px;justify-content:center;cursor:pointer}
.shots{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.shot{position:relative;flex:none;width:86px;height:110px;border-radius:10px;overflow:hidden;background:var(--chip);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted)}
.shot img{width:100%;height:100%;object-fit:cover}
.shot button{position:absolute;top:4px;right:4px;border:0;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;width:26px;height:26px;display:grid;place-items:center;padding:0}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}
.pick{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.pick details{border-bottom:1px solid var(--line)}
.pick summary{padding:10px 12px;font-weight:700;cursor:pointer}
.pick label{display:flex;gap:10px;align-items:center;padding:8px 12px 8px 20px;font-size:14px}
.pick input{width:20px;height:20px}
.viewer img{width:100%;border-radius:12px;border:1px solid var(--line)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted);font-weight:700}.kv dd{margin:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips span{font-size:12px;background:var(--chip);border-radius:999px;padding:4px 10px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.tip{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;max-width:90vw}
.foot{font-size:13px;color:var(--muted);text-align:center}

@media print{
  body{background:#fff;color:#000}
  .appbar,.tabs,.tools,.add,.mini,.rm-confirm,.foot,.fab,.pill.att{display:none!important}
  .view{padding:0;max-width:none}
  .card{box-shadow:none;border-color:#999}
  .item{break-inside:avoid}
  select.pill{border:0;background:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="appbar" id="appbar">
  <h1 id="title">Overview</h1>
  <div id="status" role="status"></div>
  <button class="savebtn" id="saveBtn" type="button" disabled>Save</button>
</header>

<main>
  <section class="view" id="v-overview"></section>
  <section class="view" id="v-list" hidden>
    <div class="tools">
      <select id="filter" class="sel grow" aria-label="Show">
        <option value="all">Show: everything</option>
        <option value="todo">Show: still to do</option>
        <option value="Cabin">Show: cabin bag</option>
        <option value="Bag 1">Show: bag 1</option>
        <option value="Bag 2">Show: bag 2</option>
        <option value="Wear">Show: wear on flight</option>
        <option value="Buy in US">Show: buy in US</option>
      </select>
      <button class="btn" id="expandAll" type="button">Open all</button>
    </div>
    <div id="sections" style="display:flex;flex-direction:column;gap:14px"></div>
    <div class="card"><div class="add">
      <input id="newSec" placeholder="Add a new list, e.g. Gifts for family" aria-label="New list name">
      <button type="button" id="addSec">Add list</button>
    </div></div>
    <div class="tools">
      <button class="btn" id="pdfBtn" type="button">Download PDF</button>
      <button class="btn" id="printBtn" type="button">Print</button>
      <button class="btn" id="installBtn" type="button" hidden>Install app</button>
    </div>
    <p class="foot">Tap a box to tick. Tap the count chip for sub-items, the bag chip to choose a bag, and the clip to attach a bill. Press Save to keep changes on this phone.</p>
  </section>
  <section class="view" id="v-bills" hidden></section>
</main>

<button class="fab" id="fab" type="button" hidden></button>

<nav class="tabs" aria-label="Sections">
  <button type="button" data-tab="overview" aria-current="page"></button>
  <button type="button" data-tab="list"></button>
  <button type="button" data-tab="bills"></button>
</nav>

<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle">
  <div class="sheet-h"><h2 id="sheetTitle"></h2><button class="mini" type="button" id="sheetClose" aria-label="Close"></button></div>
  <div class="sheet-b" id="sheetBody"></div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

function el(tag, attrs = {}, kids = []) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "text") e.textContent = v;
    else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids) if (k) e.append(k);
  return e;
}
function toast(msg) { const t = el("div", { class: "toast", role: "status", text: msg }); document.body.append(t); setTimeout(() => t.remove(), 2600); }
function newId(p = "i") { return p + (state.nextId++); }
function itemDone(it) { return it.subs && it.subs.length ? it.subs.every(s => s.done) : it.done; }
function counts(items) { let d = 0; for (const it of items) if (itemDone(it)) d++; return [d, items.length]; }
function level(d, t) { if (!t || d === t) return "done"; const p = d / t; return p >= .67 ? "hi" : p >= .34 ? "mid" : "low"; }
function allItems() { const out = []; for (const s of state.sections) for (const it of s.items) out.push([s, it]); return out; }
function findItem(id) { for (const s of state.sections) for (const it of s.items) if (it.id === id) return it; return null; }
function billsFor(id) { return (state.bills || []).filter(b => (b.itemIds || []).includes(id)); }

// ---------- file store (IndexedDB) ----------
let dbp = null;
function db() {
  if (!dbp) dbp = new Promise((res, rej) => { const r = indexedDB.open("raleigh-pack", 1); r.onupgradeneeded = () => r.result.createObjectStore("files"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  return dbp;
}
async function putFile(id, blob) { const d = await db(); return new Promise((res, rej) => { const t = d.transaction("files", "readwrite"); t.objectStore("files").put(blob, id); t.oncomplete = res; t.onerror = () => rej(t.error); }); }
async function getFile(id) { const d = await db(); return new Promise((res, rej) => { const r = d.transaction("files").objectStore("files").get(id); r.onsuccess = () => res(r.result || null); r.onerror = () => rej(r.error); }); }
async function delFile(id) { const d = await db(); return new Promise(res => { const t = d.transaction("files", "readwrite"); t.objectStore("files").delete(id); t.oncomplete = res; t.onerror = res; }); }
const urlCache = new Map();
async function fileUrl(id) { if (urlCache.has(id)) return urlCache.get(id); const b = await getFile(id); if (!b) return null; const u = URL.createObjectURL(b); urlCache.set(id, u); return u; }

// "scanner": shrink photo, optional document clean-up (grey + contrast)
async function processImage(file, docMode) {
  const bmp = await createImageBitmap(file).catch(() => null);
  if (!bmp) return file;
  const max = 1800, sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
  const g = c.getContext("2d"); g.drawImage(bmp, 0, 0, c.width, c.height);
  if (docMode) {
    const im = g.getImageData(0, 0, c.width, c.height), a = im.data;
    let lo = 255, hi = 0; const hist = new Uint32Array(256);
    for (let i = 0; i < a.length; i += 4) { const y = (a[i] * 299 + a[i + 1] * 587 + a[i + 2] * 114) / 1000 | 0; hist[y]++; }
    let n = 0, tot = a.length / 4; for (let i = 0; i < 256; i++) { n += hist[i]; if (n > tot * .02) { lo = i; break; } }
    n = 0; for (let i = 255; i >= 0; i--) { n += hist[i]; if (n > tot * .05) { hi = i; break; } }
    const r = Math.max(1, hi - lo);
    for (let i = 0; i < a.length; i += 4) { const y = (a[i] * 299 + a[i + 1] * 587 + a[i + 2] * 114) / 1000; const v = Math.max(0, Math.min(255, (y - lo) * 255 / r)); a[i] = a[i + 1] = a[i + 2] = v; }
    g.putImageData(im, 0, 0);
  }
  return await new Promise(res => c.toBlob(b => res(b || file), "image/jpeg", .82));
}

}
function migrate(s) {
  if (!s.bills) s.bills = [];

    const fresh = DEFAULT_DATA, map = {};
    for (const sec of fresh.sections) for (const it of sec.items) map[it.id] = it;
    for (const sec of s.sections) for (const it of sec.items) if (["i12", "i13", "i15", "i25", "i223"].includes(it.id) && map[it.id]) it.text = map[it.id].text;
    const have = new Set(); for (const sec of s.sections) for (const it of sec.items) have.add(it.id);
    for (const fsec of fresh.sections) {
      const sec = s.sections.find(x => x.id === fsec.id); if (!sec) continue;
      fsec.items.forEach((it, i) => { if (!have.has(it.id)) sec.items.splice(Math.min(i, sec.items.length), 0, JSON.parse(JSON.stringify(it))); });
    }
    s.version = 2; s.nextId = Math.max(s.nextId || 0, fresh.nextId);

}

function visible(sec, it) {
  const f = $("#filter").value;

  if (f === "todo") return !itemDone(it);
  return sec.kind !== "task" && it.bag === f;
}
function removeBtn(key, doRemove, label) {

  return el("button", { class: "mini", type: "button", "aria-label": label, html: ico("x"), onclick: () => { pendingRemove = key; clearTimeout(removeTimer); removeTimer = setTimeout(() => { pendingRemove = null; render(); }, 3000); render(); } });
}
function renderList() {

    const shown = sec.items.filter(it => visible(sec, it));
    if (filtering && !shown.length) continue;

    const isOpen = openSecs.has(sec.id) || filtering || printing;
    const card = el("section", { class: "card sec" + (isOpen ? " open" : ""), id: "sec-" + sec.id });
    const head = el("button", { class: "sec-h", type: "button", "aria-expanded": String(isOpen), onclick: () => { openSecs.has(sec.id) ? openSecs.delete(sec.id) : openSecs.add(sec.id); render(); } });

    head.append(el("div", { style: "min-width:0" }, [el("h2", { text: sec.title }), el("div", { class: "bar", html: `<i class="fill-${lv}" style="width:${ct ? Math.round(cd / ct * 100) : 100}%"></i>` })]),

  box.addEventListener("change", () => { if (hasSubs && it.subs.length) it.subs.forEach(s => s.done = box.checked); else it.done = box.checked; markDirty(); });

// ---------- bills ----------
function today() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
function dueLevel(b) { if (!b.returnBy) return "none"; const days = Math.round((new Date(b.returnBy + "T00:00") - today()) / 864e5); return days < 0 ? "late" : days <= 7 ? "soon" : "ok"; }

      el("div", { class: "meta" }, [money(b) ? el("span", { class: "amt", text: money(b) }) : null, el("span", { class: "due " + dueLevel(b), text: dueText(b) })]),

function billForm(bill, preItems = []) {
  const editing = !!bill;

    // scanner
    const shots = el("div", { class: "shots" });

        const s = el("div", { class: "shot", text: f.type === "pdf" ? "PDF" : "" });
        if (f.type !== "pdf") { const nf = newFiles.find(n => n.id === f.id); const p = nf ? Promise.resolve(URL.createObjectURL(nf.blob)) : fileUrl(f.id); p.then(u => u && s.append(el("img", { src: u, alt: "Page" }))); }

    };
    const docMode = el("input", { type: "checkbox", id: "docmode" }); docMode.checked = true;
    const handle = async files => {
      for (const file of files) {
        const isPdf = file.type === "application/pdf";
        const blob = isPdf ? file : await processImage(file, docMode.checked);

    };
    const cam = el("input", { type: "file", accept: "image/*", capture: "environment", hidden: true, id: "camIn" });
    const up = el("input", { type: "file", accept: "image/*,application/pdf", multiple: true, hidden: true, id: "upIn" });

      el("div", { class: "scanbtns" }, [el("label", { class: "btn primary", for: "camIn", html: ico("cam") + "Scan with camera" }), el("label", { class: "btn", for: "upIn", html: ico("up") + "Choose photo / PDF" }), cam, up]),
      el("label", { class: "chk", for: "docmode" }, [docMode, document.createTextNode("Clean up like a scanner (black and white, sharper text)")]),

    // quick return-window buttons

    const files = bill.files || [];
    const viewer = el("div", { class: "viewer", style: "display:flex;flex-direction:column;gap:10px" });
    for (const f of files) {
      if (f.type === "pdf") viewer.append(el("button", { class: "btn", type: "button", text: "Open PDF", onclick: async () => { const u = await fileUrl(f.id); if (u) window.open(u, "_blank"); } }));
      else fileUrl(f.id).then(u => u && viewer.append(el("img", { src: u, alt: "Bill photo" })));
    }
    if (!files.length) viewer.append(el("p", { class: "tip", text: "No photo attached." }));
    b.append(viewer);
    const dl = el("dl", { class: "kv" });
    const add = (k, v) => { if (v) dl.append(el("dt", { text: k }), el("dd", { text: v })); };
    add("Type", bill.type); add("Amount", money(bill)); add("Bought", bill.date); add("Return by", bill.returnBy ? bill.returnBy + " (" + dueText(bill).toLowerCase() + ")" : ""); add("Notes", bill.notes);
    b.append(dl);
    const names = (bill.itemIds || []).map(id => findItem(id)?.text).filter(Boolean);
    if (names.length) b.append(el("div", { class: "fld" }, [el("span", { class: "lb", text: "Covers" }), el("div", { class: "chips" }, names.map(n => el("span", { text: n })))]));
    const share = el("button", { class: "btn primary", type: "button", html: ico("share") + "Share for refund", onclick: async () => {
      const text = `${bill.type}: ${bill.shop || ""}${money(bill) ? ", " + money(bill) : ""}${bill.date ? ", bought " + bill.date : ""}${names.length ? ". Items: " + names.join(", ") : ""}${bill.notes ? ". " + bill.notes : ""}`;
      try {
        const fl = []; for (const [i, f] of files.entries()) { const bl = await getFile(f.id); if (bl) fl.push(new File([bl], `bill-${i + 1}.${f.type === "pdf" ? "pdf" : "jpg"}`, { type: bl.type || (f.type === "pdf" ? "application/pdf" : "image/jpeg") })); }
        if (navigator.canShare && fl.length && navigator.canShare({ files: fl })) await navigator.share({ files: fl, text, title: "Bill" });
        else if (navigator.share) await navigator.share({ text, title: "Bill" });
        else { await navigator.clipboard.writeText(text); toast("Details copied"); }
      } catch (e) { if (e && e.name !== "AbortError") toast("Sharing is not available here"); }
    } });
    const save1 = el("button", { class: "btn", type: "button", html: ico("up") + "Save photo", onclick: async () => {
      for (const [i, f] of files.entries()) { const bl = await getFile(f.id); if (!bl) continue; const a = el("a", { href: URL.createObjectURL(bl), download: `${(bill.shop || "bill").replace(/\W+/g, "_")}-${i + 1}.${f.type === "pdf" ? "pdf" : "jpg"}` }); document.body.append(a); a.click(); a.remove(); }
    } });
    b.append(el("div", { class: "actions" }, [share, save1, el("button", { class: "btn", type: "button", text: "Edit", onclick: () => billForm(bill) })]));
    let armed = false;
    const del = el("button", { class: "btn danger", type: "button", text: "Delete this bill", onclick: () => {
      if (!armed) { armed = true; del.textContent = "Tap again to delete"; setTimeout(() => { armed = false; del.textContent = "Delete this bill"; }, 3000); return; }
      for (const f of bill.files || []) delFile(f.id);
      state.bills = state.bills.filter(x => x !== bill); closeSheet(); markDirty(); save();
    } });
    b.append(del);
  });
}

// ---------- tabs ----------
const TABS = { overview: ["Overview", "home"], list: ["Checklist", "list"], bills: ["Bills", "bill"] };
function renderTabs() {
  const due = (state.bills || []).filter(b => ["soon", "late"].includes(dueLevel(b))).length;
  document.querySelectorAll(".tabs button").forEach(b => {
    const k = b.dataset.tab; b.innerHTML = ico(TABS[k][1]) + `<span>${TABS[k][0]}${k === "bills" && due ? `<span class="badge">${due}</span>` : ""}</span>`;
    b.setAttribute("aria-current", k === tab ? "page" : "false");
  });
  $("#title").textContent = k2title(tab);
  const fab = $("#fab"); fab.hidden = tab !== "bills"; fab.innerHTML = ico("cam") + "Scan bill";
}
function k2title(k) { return k === "overview" ? "Raleigh Packing List" : TABS[k][0]; }
function go(k) {
  tab = k; try { sessionStorage.setItem(TAB_KEY, k); } catch (e) {}
  for (const key of Object.keys(TABS)) $("#v-" + key).hidden = key !== k;
  renderTabs(); window.scrollTo(0, 0);
}

// ---------- PDF ----------
async function makePdf() {
  if (!window.jspdf) { toast("PDF tool did not load. Connect to the internet and try again."); return; }
  const { jsPDF } = window.jspdf; const doc = new jsPDF({ unit: "mm", format: "a4" });
  const W = 210, M = 15, maxW = W - 2 * M; let y = 18;
  const clean = s => String(s).replace(/₹/g, "Rs ").replace(/[^\x20-\x7E -ÿ]/g, "-");
  const need = h => { if (y + h > 282) { doc.addPage(); y = 16; } };
  doc.setFont("helvetica", "bold"); doc.setFontSize(18); doc.setTextColor(27, 45, 91); doc.text("Raleigh Packing List - J-1 Postdoc, NC State", M, y); y += 6;
  let d = 0, t = 0; for (const [, it] of allItems()) { t++; if (itemDone(it)) d++; }
  doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(110); doc.text(`Pune to Raleigh-Durham (RDU)  |  ${d} of ${t} done  |  printed ${new Date().toLocaleDateString("en-IN")}`, M, y); y += 8;
  const box = (x, yy, s, ok) => { doc.setDrawColor(27, 45, 91); doc.setLineWidth(.35); doc.rect(x, yy - s + .6, s, s); if (ok) { doc.setDrawColor(30, 122, 70); doc.setLineWidth(.6); doc.line(x + .7, yy - s / 2 + .6, x + s * .4, yy + .1); doc.line(x + s * .4, yy + .1, x + s - .5, yy - s + 1.2); } };
  for (const sec of state.sections) {
    need(18); const [cd, ct] = counts(sec.items);
    doc.setFillColor(27, 45, 91); doc.rect(M, y - 5, maxW, 7.5, "F"); doc.setFont("helvetica", "bold"); doc.setFontSize(11.5); doc.setTextColor(255);
    doc.text(clean(sec.title), M + 2, y); doc.text(`${cd}/${ct}`, W - M - 2, y, { align: "right" }); y += 7;
    if (sec.note) { doc.setFont("helvetica", "italic"); doc.setFontSize(8.5); doc.setTextColor(122, 67, 0); const ls = doc.splitTextToSize(clean(sec.note), maxW); need(ls.length * 3.8); doc.text(ls, M, y); y += ls.length * 3.8 + 1.5; }
    for (const it of sec.items) {
      doc.setFont("helvetica", "normal"); doc.setFontSize(10.5); doc.setTextColor(25);
      const lines = doc.splitTextToSize(clean(it.text), maxW - 34); need(lines.length * 4.6 + 2);
      box(M + 1, y, 4, itemDone(it)); doc.text(lines, M + 8, y);
      const tagT = [it.bag, billsFor(it.id).length ? "bill" : ""].filter(Boolean).join(" | ");
      if (tagT) { doc.setFontSize(8.5); doc.setTextColor(120); doc.text(clean(tagT), W - M, y, { align: "right" }); }
      y += lines.length * 4.6 + 1.6;
      for (const s of (it.subs || [])) { doc.setFontSize(9.5); doc.setTextColor(60); const sl = doc.splitTextToSize(clean(s.text), maxW - 24); need(sl.length * 4.2 + 1); box(M + 9, y, 3.3, s.done); doc.text(sl, M + 15, y); y += sl.length * 4.2 + 1; }
      doc.setDrawColor(225); doc.setLineWidth(.2); doc.line(M, y - 1.2, W - M, y - 1.2); y += 1.2;
    }
    y += 3;
  }
  if ((state.bills || []).length) {
    need(20); doc.setFillColor(229, 138, 18); doc.rect(M, y - 5, maxW, 7.5, "F"); doc.setFont("helvetica", "bold"); doc.setFontSize(11.5); doc.setTextColor(255); doc.text("Bills and proofs", M + 2, y); y += 8;
    for (const b of state.bills) {
      doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(25);
      const items = (b.itemIds || []).map(id => findItem(id)?.text).filter(Boolean).join(", ");
      const line = doc.splitTextToSize(clean(`${b.shop || b.type} - ${money(b)} - bought ${b.date || "?"}${b.returnBy ? " - return by " + b.returnBy : ""}${items ? " - for: " + items : ""}`), maxW);
      need(line.length * 4.4 + 2); doc.text(line, M, y); y += line.length * 4.4 + 2;
    }
  }
  const pages = doc.getNumberOfPages();
  for (let p = 1; p <= pages; p++) { doc.setPage(p); doc.setFontSize(8); doc.setTextColor(140); doc.text(`Page ${p} of ${pages}`, W - M, 290, { align: "right" }); doc.text("Declare all food at US customs. No rice.", M, 290); }
  doc.save("Raleigh_Packing_List.pdf"); toast("PDF downloaded");
}

// ---------- boot ----------
function boot() {
  let data = null;
  try { data = JSON.parse(localStorage.getItem(SAVED_KEY) || "null"); } catch (e) {}
  if (!data || !Array.isArray(data.sections)) data = JSON.parse(JSON.stringify(DEFAULT_DATA));
  state = migrate(data);
  try { const dr = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null"); if (dr && Array.isArray(dr.sections) && JSON.stringify(migrate(dr)) !== JSON.stringify(state)) { state = dr; dirty = true; } } catch (e) {}
  if (!state.nextId) state.nextId = 10000;
  if (state.sections[0]) openSecs.add(state.sections[0].id);
  $("#sheetClose").innerHTML = ico("x");
  render();
  setStatus(dirty ? "Not saved" : "", dirty ? "dirty" : ""); $("#saveBtn").disabled = !dirty;
  let t0 = "overview"; try { t0 = sessionStorage.getItem(TAB_KEY) || "overview"; } catch (e) {}
  go(TABS[t0] ? t0 : "overview");
}
$("#saveBtn").addEventListener("click", save);
$("#pdfBtn").addEventListener("click", makePdf);
$("#filter").addEventListener("change", render);
$("#fab").addEventListener("click", () => billForm(null));
$("#sheetClose").addEventListener("click", closeSheet);
$("#sheet").addEventListener("click", e => { if (e.target === e.currentTarget) closeSheet(); });
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => go(b.dataset.tab)));
$("#expandAll").addEventListener("click", () => { const all = state.sections.every(s => openSecs.has(s.id)); state.sections.forEach(s => all ? openSecs.delete(s.id) : openSecs.add(s.id)); $("#expandAll").textContent = all ? "Open all" : "Close all"; render(); });
function addSection() { const i = $("#newSec"); const v = i.value.trim(); if (!v) return; const id = "s" + (state.nextId++); state.sections.push({ id, title: v, note: "", kind: "pack", items: [] }); openSecs.add(id); i.value = ""; markDirty(); }
$("#addSec").addEventListener("click", addSection);
$("#newSec").addEventListener("keydown", e => { if (e.key === "Enter") addSection(); });
window.addEventListener("scroll", () => $("#appbar").classList.toggle("scrolled", scrollY > 4), { passive: true });
window.addEventListener("beforeunload", () => { if (dirty) try { localStorage.setItem(DRAFT_KEY, JSON.stringify(state)); } catch (e) {} });
window.addEventListener("beforeprint", () => { printing = true; render(); });
window.addEventListener("afterprint", () => { printing = false; render(); });
$("#printBtn").addEventListener("click", () => { printing = true; render(); setTimeout(() => window.print(), 50); });
let installEvt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; $("#installBtn").hidden = false; });
$("#installBtn").addEventListener("click", async () => { if (!installEvt) return; installEvt.prompt(); try { await installEvt.userChoice; } catch (e) {} installEvt = null; $("#installBtn").hidden = true; });
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
boot();
</script>
